<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Q&A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: #fff;
      letter-spacing: -0.3px;
    }

    h1 span { color: #ff4e4e; }

    #model-badge {
      font-size: 0.75rem;
      color: #666;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.03em;
    }

    #model-badge span { color: #a78bfa; font-weight: 600; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 680px;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 1rem;
    }

    .row {
      display: flex;
      gap: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #555; }
    input[type="text"]::placeholder { color: #444; }

    button {
      background: #ff4e4e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #e03e3e; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #video-status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    .status-ok   { color: #4ade80; }
    .status-err  { color: #f87171; }
    .status-info { color: #60a5fa; }

    /* Chat */
    #chat-box {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 420px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding-right: 0.25rem;
    }

    #chat-box:empty::before {
      content: "Ask a question about the video to start the conversation.";
      color: #444;
      font-size: 0.9rem;
      display: block;
      text-align: center;
      padding: 2rem 0;
    }

    .bubble {
      max-width: 88%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: #2a2a2a;
      border: 1px solid #333;
    }

    .bubble.ai {
      align-self: flex-start;
      background: #1e1e2e;
      border: 1px solid #2e2e4e;
      color: #c7d2fe;
    }

    .bubble.error {
      align-self: flex-start;
      background: #2a1010;
      border: 1px solid #5a2020;
      color: #f87171;
    }

    .bubble .model-tag {
      display: block;
      font-size: 0.72rem;
      color: #555;
      margin-top: 0.4rem;
    }

    .bubble.thinking {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #555;
      font-style: italic;
    }

    /* scrollbar */
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>

  <h1>YouTube <span>Q&A</span></h1>
  <div id="model-badge">Model: <span id="model-name">loading…</span></div>

  <!-- Video Setup -->
  <div class="card">
    <h2>Video Setup</h2>
    <div class="row">
      <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="process-btn">Load Video</button>
    </div>
    <p id="video-status"></p>
  </div>

  <!-- Chat -->
  <div class="card">
    <h2>Chat</h2>
    <div id="chat-box"></div>
    <div class="row">
      <input type="text" id="question-input" placeholder="Ask a question about the video..." />
      <button id="ask-btn">Send</button>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    let activeVideoId = null;

    // fetch and display active model on load
    fetch(`${API}/active_model`)
      .then(r => r.json())
      .then(d => { document.getElementById("model-name").textContent = d.model.replace("models/", ""); })
      .catch(() => { document.getElementById("model-name").textContent = "unavailable"; });

    const urlInput      = document.getElementById("url-input");
    const processBtn    = document.getElementById("process-btn");
    const videoStatus   = document.getElementById("video-status");
    const questionInput = document.getElementById("question-input");
    const askBtn        = document.getElementById("ask-btn");
    const chatBox       = document.getElementById("chat-box");

    // ── helpers ──────────────────────────────────────────────────────────────

    function setStatus(msg, type = "info") {
      videoStatus.textContent = msg;
      videoStatus.className = `status-${type}`;
    }

    function addBubble(text, role) {
      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function setLoading(isLoading) {
      processBtn.disabled = isLoading;
      askBtn.disabled     = isLoading;
      urlInput.disabled   = isLoading;
      questionInput.disabled = isLoading;
    }

    // ── process video ─────────────────────────────────────────────────────────

    processBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) { setStatus("Please enter a YouTube URL.", "err"); return; }

      setLoading(true);
      setStatus("Processing video…", "info");
      activeVideoId = null;

      try {
        const res  = await fetch(`${API}/process_video`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ youtube_url: url }),
        });
        const data = await res.json();

        if (!res.ok) {
          setStatus(`Error: ${data.detail}`, "err");
          return;
        }

        activeVideoId = data.video_id;
        const label = data.cached ? "Loaded from cache" : "Indexed successfully";
        setStatus(`✓ ${label} — Video ID: ${data.video_id}`, "ok");
        chatBox.innerHTML = "";

      } catch (err) {
        setStatus("Could not reach the server. Is it running?", "err");
      } finally {
        setLoading(false);
      }
    });

    // ── ask question ──────────────────────────────────────────────────────────

    async function sendQuestion() {
      const question = questionInput.value.trim();

      if (!activeVideoId) {
        addBubble("⚠ Load a video first before asking questions.", "error");
        return;
      }
      if (!question) return;

      questionInput.value = "";
      addBubble(question, "user");
      const thinking = addBubble("Thinking…", "thinking");
      setLoading(true);

      try {
        const res  = await fetch(`${API}/ask_question`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ video_id: activeVideoId, question }),
        });
        const data = await res.json();

        thinking.remove();

        if (!res.ok) {
          addBubble(`Error: ${data.detail}`, "error");
          return;
        }

        const bubble = addBubble(data.answer, "ai");
        const tag = document.createElement("span");
        tag.className = "model-tag";
        tag.textContent = data.model.replace("models/", "");
        bubble.appendChild(tag);

      } catch (err) {
        thinking.remove();
        addBubble("Could not reach the server. Is it running?", "error");
      } finally {
        setLoading(false);
        questionInput.focus();
      }
    }

    askBtn.addEventListener("click", sendQuestion);
    questionInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) sendQuestion();
    });
  </script>
</body>
</html>
